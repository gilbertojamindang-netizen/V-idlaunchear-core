name: Build CI

# APK builds are intentionally manual while VØID features are still in development.
# Run this workflow from Actions only after the feature-complete review is approved.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        required: true
        type: choice
        options:
          - Debug
          - Release
        default: Debug

jobs:
  Build:
    uses: ./.github/workflows/build.yml
    with:
      variant: ${{ inputs.variant }}
    secrets:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
