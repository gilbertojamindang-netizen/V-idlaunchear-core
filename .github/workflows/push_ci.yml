name: Build CI

# APK builds are intentionally blocked until the feature-complete review is approved.
on:
  workflow_dispatch:
    inputs:
      confirm_feature_complete:
        description: Confirm all requested VØID features are complete and reviewed
        required: true
        type: boolean
        default: false
      variant:
        description: Build variant
        required: true
        type: choice
        options:
          - Debug
          - Release
        default: Debug

jobs:
  Build:
    if: inputs.confirm_feature_complete == true
    uses: ./.github/workflows/build.yml
    with:
      variant: ${{ inputs.variant }}
    secrets:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
